name: Build Sideloadly IPA

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']   # docs-only pushes don't need a macOS build
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: MAVLink protocol tests (parity with Mission Planner MAVLink.dll fixtures)
        run: swift test --package-path Packages/MAVLinkKit

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned IPA
        run: bash scripts/package_ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MissionPlanner-iPad-Sideloadly
          path: build/MissionPlanner-iPad-Sideloadly.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

  # TEST-030: the app layer (LinkManager, VehicleModel, stores) against the scriptable fake drone, headless,
  # plus the crash probes and fuzzers. Fails on any FAIL/CRASH. See testing/README.md.
  break-test:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build headless harness (app Link/Vehicle/Storage sources + driver)
        run: testing/harness/build_harness.sh
      - name: Scenarios + probes against the fake drone (no SITL)
        run: python3 testing/scenarios/run.py -j 2 ci
      - name: Upload scenario logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: break-test-logs
          path: testing/logs/

  # Runs the real app in the iPad Simulator against tools/fake_vehicle.py and publishes screenshots
  # to the ci-screenshots branch. Only on manual runs or commits whose message contains [sim].
  simulator:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sim]')
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build, run in iPad Simulator, take screenshots
        run: bash scripts/sim_screenshots.sh

      - name: Publish screenshots to the ci-screenshots branch
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d build/sim ] || exit 0
          cd build/sim
          echo "Commit ${GITHUB_SHA::7}, run ${GITHUB_RUN_NUMBER}" > SOURCE.txt
          git init -q
          git checkout -q -b ci-screenshots
          git add -A
          git -c user.name="ci" -c user.email="ci@localhost" commit -qm "Simulator screenshots for ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER})"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: build/sim
          if-no-files-found: ignore
