# Test-only XcodeGen spec: the unmodified app as a Mac Catalyst app + the break-test XCUITests, so the SwiftUI/UIKit UI
# can be exercised on a Mac without the iOS simulator runtime. Generated by `testing/sim/catalyst.sh`.
name: MissionPlannerPadCatalyst
options:
  bundleIdPrefix: io.github.missionplannerpad
  deploymentTarget:
    iOS: "16.0"
packages:
  MAVLinkKit:
    path: ../../Packages/MAVLinkKit
settings:
  base:
    SUPPORTS_MACCATALYST: YES
    DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    PROVISIONING_PROFILE_SPECIFIER: ""
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "5.0"
targets:
  MissionPlannerPad:
    type: application
    platform: iOS
    sources: [{path: ../../App}]
    dependencies: [{package: MAVLinkKit}]
    settings:
      base:
        PRODUCT_NAME: MissionPlannerPad
        PRODUCT_BUNDLE_IDENTIFIER: io.github.missionplannerpad.breaktest
        INFOPLIST_FILE: $(SRCROOT)/../../../Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "2"
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "1"
  BreakTestUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [{path: UITests}]
    dependencies: [{target: MissionPlannerPad}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
        PRODUCT_BUNDLE_IDENTIFIER: io.github.missionplannerpad.breaktest.uitests
        TEST_TARGET_NAME: MissionPlannerPad
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
schemes:
  BreakTestCatalyst:
    build: {targets: {MissionPlannerPad: all, BreakTestUITests: [test]}}
    test: {targets: [BreakTestUITests]}
